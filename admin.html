<style>
  :root {
    --ink: #23292f;
    --muted: #6b7480;
    --navy: #243a50;
    --navy-deep: #182b3d;
    --wine: #873d49;
    --gold: #e4a941;
    --canvas: #f3f5f4;
    --line: #dfe3e1;
    --soft: #ecefee;
    --card: #ffffff;
    --ok: #2e6e4e;
    --sidebar-w: 212px;
    --serif: "Noto Serif SC", "Songti SC", SimSun, serif;
    --sans: "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--ink); background: var(--canvas); font: 14px/1.65 var(--sans); }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

  /* ── 顶栏 ─────────────────────────────── */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    height: 58px; padding: 0 20px;
    background: linear-gradient(100deg, var(--navy-deep), #2c4258); color: #fff;
  }
  .topbar .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
  .topbar .brand b { font: 700 17px/1.3 var(--serif); white-space: nowrap; }
  .topbar .brand small { opacity: .72; font-size: 12px; }
  .topbar .actions { display: flex; align-items: center; gap: 10px; }
  .link-preview { padding: 7px 12px; border: 1px solid rgba(255,255,255,.38); border-radius: 6px; font-size: 13px; }
  .link-preview:hover { background: rgba(255,255,255,.12); }
  .btn-publish {
    position: relative; border: 0; border-radius: 6px; padding: 8px 16px;
    background: var(--gold); color: #23292f; font-weight: 700;
  }
  .btn-publish:hover { filter: brightness(1.05); }
  .btn-publish .count {
    display: none; min-width: 19px; margin-left: 7px; padding: 0 5px;
    background: #23292f; color: #fff; border-radius: 99px; font-size: 11px; line-height: 18px;
  }
  .btn-publish .count.on { display: inline-block; }
  .menu-toggle { display: none; border: 1px solid rgba(255,255,255,.38); background: transparent; color: #fff; border-radius: 6px; padding: 7px 12px; }

  /* ── 布局 ─────────────────────────────── */
  .layout { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: calc(100vh - 58px); }
  .sidenav { background: var(--card); border-right: 1px solid var(--line); padding: 14px 10px 24px; }
  .sidenav .group { margin: 14px 8px 4px; font-size: 11px; letter-spacing: .08em; color: var(--muted); }
  .sidenav a {
    display: block; padding: 10px 12px; margin: 1px 0; border-left: 3px solid transparent;
    border-radius: 0 6px 6px 0; color: #3a434c;
  }
  .sidenav a:hover { background: var(--soft); }
  .sidenav a.active { border-left-color: var(--wine); background: #f8f3f3; color: var(--navy-deep); font-weight: 700; }
  .sidenav a .hint { float: right; color: var(--muted); font-size: 12px; font-weight: 400; }
  main.view { padding: 26px 30px 60px; max-width: 1080px; width: 100%; }

  /* ── 页头与卡片 ───────────────────────── */
  .view-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .view-head h1 { margin: 0; font: 700 22px/1.4 var(--serif); color: var(--navy-deep); }
  .view-head .sub { margin-top: 4px; color: var(--muted); font-size: 13px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; }
  .card + .card { margin-top: 14px; }
  .card h2 { margin: 0 0 4px; font: 700 16px/1.5 var(--serif); color: var(--navy-deep); }
  .card .desc { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  .grid-entries { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .entry { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--navy); border-radius: 8px; padding: 15px 16px; }
  .entry.wine { border-left-color: var(--wine); }
  .entry b { display: block; font-size: 15px; }
  .entry p { margin: 5px 0 11px; color: var(--muted); font-size: 13px; min-height: 36px; }

  /* ── 按钮 / 标签 / 状态 ───────────────── */
  .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid transparent; border-radius: 6px; padding: 8px 15px; background: var(--navy); color: #fff; }
  .btn:hover { background: var(--navy-deep); }
  .btn.accent { background: var(--wine); }
  .btn.accent:hover { filter: brightness(.92); }
  .btn.ghost { background: var(--card); border-color: var(--line); color: var(--ink); }
  .btn.ghost:hover { border-color: var(--muted); background: var(--soft); }
  .btn.sm { padding: 4px 10px; font-size: 12.5px; }
  .tag { display: inline-block; margin-right: 6px; padding: 1px 8px; background: var(--soft); color: var(--navy); border-radius: 4px; font-size: 12px; white-space: nowrap; }
  .tag.wine { background: #f5e9ea; color: var(--wine); }
  .tag.gold { background: #f9efd9; color: #8a6414; }
  .tag.dim { background: transparent; border: 1px dashed var(--line); color: var(--muted); }
  .meta { color: var(--muted); font-size: 12.5px; }

  /* ── 列表行 ───────────────────────────── */
  .rows { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 18px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .grow { flex: 1; min-width: 0; }
  .row h3 { margin: 0; font-size: 14.5px; font-weight: 600; line-height: 1.5; }
  .row p { margin: 3px 0 0; }
  .row .acts { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .year-head { margin: 20px 0 8px; font: 700 15px/1.4 var(--serif); color: var(--navy); }
  .year-head:first-child { margin-top: 0; }
  .empty { border: 1px dashed var(--line); border-radius: 8px; background: var(--card); padding: 34px 20px; text-align: center; color: var(--muted); }
  .empty b { display: block; margin-bottom: 6px; color: var(--ink); }

  /* ── 表单 ─────────────────────────────── */
  .form { max-width: 720px; }
  .fld { margin-bottom: 16px; }
  .fld > label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13.5px; }
  .fld .hint { margin-top: 5px; color: var(--muted); font-size: 12.5px; }
  .fld input[type=text], .fld input[type=email], .fld input[type=date], .fld input[type=number], .fld select, .fld textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--ink); font: inherit;
  }
  .fld textarea { min-height: 96px; resize: vertical; }
  .fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(36,58,80,.12); outline: none; }
  .fld-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px; }
  .checks label {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px;
    border: 1px solid var(--line); border-radius: 99px; font-size: 13px; cursor: pointer; background: #fff;
  }
  .checks label:has(input:checked) { border-color: var(--navy); background: #eef2f5; font-weight: 600; }
  .checks input { accent-color: var(--navy); }

  .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .switch input { position: absolute; opacity: 0; }
  .switch .track { width: 38px; height: 22px; border-radius: 99px; background: #c6ccc9; position: relative; transition: background .15s; flex-shrink: 0; }
  .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .switch input:checked + .track { background: var(--ok); }
  .switch input:checked + .track::after { transform: translateX(16px); }
  .switch input:focus-visible + .track { outline: 3px solid var(--gold); outline-offset: 2px; }
  .switch .sw-label { font-size: 13px; }

  /* ── 上传控件 ─────────────────────────── */
  .up { display: flex; gap: 16px; align-items: flex-start; }
  .up-preview {
    width: 112px; aspect-ratio: 4 / 5; flex-shrink: 0; border-radius: 6px;
    background: linear-gradient(145deg, #dce2e2, #abb9be);
    display: grid; place-items: center; color: #46555f; font-size: 12px; text-align: center;
    background-size: cover; background-position: center top;
  }
  .up-preview.wide { width: 100%; max-width: 420px; aspect-ratio: 16 / 6; }
  .up-preview.wide-logo {
    width: 100%; max-width: 300px; aspect-ratio: 10 / 3; flex: 0 0 auto;
    background-color: #fff; border: 1px solid var(--line);
    background-size: contain; background-position: center; background-repeat: no-repeat;
  }
  .up.has-img .up-preview span { display: none; }
  .up { flex-wrap: wrap; }
  .up-side { min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  .up-side .hint { margin: 0; }
  .up-side .up-input { max-width: 100%; font-size: 12.5px; }
  .up-preview.sq { width: 88px; aspect-ratio: 1 / 1; }
  .up-preview.r43 { aspect-ratio: 4 / 3; }
  .up-preview.r169 { width: 100%; max-width: 460px; aspect-ratio: 16 / 9; }
  .up-preview.wide, .up-preview.r169 { flex: 1 1 100%; }
  .platform-ups { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .platform-ups .up { flex-direction: column; gap: 10px; }
  .platform-ups .up-preview { width: 100%; }
  .platform-ups .up-side .hint { font-weight: 600; color: var(--navy); }
  .fld input[type=color] { width: 64px; height: 38px; padding: 2px; border: 1px solid var(--line); border-radius: 6px; background: #fff; cursor: pointer; }
  /* 裁剪弹窗 */
  #cropDialog { border: none; border-radius: 12px; padding: 18px 20px 16px; width: min(760px, 94vw); box-shadow: 0 18px 60px rgba(10, 18, 24, 0.35); }
  #cropDialog::backdrop { background: rgba(15, 23, 30, 0.55); }
  .crop-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  .crop-head .meta { font-size: 12px; color: var(--muted); }
  .crop-stage { position: relative; margin: 0 auto; overflow: hidden; background: #10181e; border-radius: 8px; touch-action: none; cursor: grab; }
  .crop-stage:active { cursor: grabbing; }
  .crop-stage canvas { position: absolute; left: 50%; top: 50%; transform-origin: center; max-width: none; }
  .crop-grid { position: absolute; inset: 0; pointer-events: none; border: 1px solid rgba(255,255,255,0.35); background-image: linear-gradient(rgba(255,255,255,0.14) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.14) 1px, transparent 1px); background-size: 33.34% 33.34%; }
  .crop-bar { display: flex; align-items: center; gap: 14px; margin-top: 12px; flex-wrap: wrap; }
  .crop-bar label { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); flex: 1; min-width: 200px; }
  .crop-bar input[type=range] { flex: 1; }
  .crop-foot { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
  .appearance-preview { border: 1px solid var(--line); border-radius: 8px; padding: 16px; background: var(--canvas); }

  /* ── 成员网格 ─────────────────────────── */
  .member-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 14px; }
  .member-tile { display: block; text-align: center; }
  .member-tile .ph { aspect-ratio: 4 / 5; border-radius: 6px; background: linear-gradient(145deg, #dce2e2, #abb9be); display: grid; place-items: center; color: #46555f; font-size: 12px; background-size: cover; }
  .member-tile:hover .ph { outline: 3px solid var(--wine); outline-offset: 2px; }
  .member-tile .nm { margin-top: 7px; font-size: 13px; }
  .mentor-box { display: grid; grid-template-columns: 108px 1fr; gap: 18px; }
  .mentor-box .ph { aspect-ratio: 4 / 5; border-radius: 6px; background: linear-gradient(145deg, #dce2e2, #abb9be); display: grid; place-items: center; color: #46555f; font-size: 12px; }
  .mentor-box h3 { margin: 0 0 4px; font: 700 18px/1.4 var(--serif); }

  /* ── 图片素材 ─────────────────────────── */
  .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  .media-tile { background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .media-tile .ph { aspect-ratio: 4 / 3; background: linear-gradient(145deg, #d8dfdf, #a9b8bd); display: grid; place-items: center; color: #46555f; font-size: 12px; }
  .media-tile .cap { padding: 9px 11px; font-size: 12.5px; }
  .media-tile .cap b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ── 对话框 / 提示 ────────────────────── */
  dialog { border: 0; border-radius: 10px; padding: 0; width: min(460px, calc(100vw - 40px)); box-shadow: 0 24px 60px rgba(15,26,37,.3); }
  dialog::backdrop { background: rgba(15, 26, 37, .45); }
  .dlg-head { background: var(--navy-deep); color: #fff; padding: 14px 20px; font: 700 16px/1.4 var(--serif); }
  .dlg-body { padding: 18px 20px; }
  .dlg-body ul { margin: 0 0 14px; padding-left: 20px; color: #3a434c; }
  .dlg-body li { margin: 4px 0; }
  .dlg-foot { display: flex; justify-content: flex-end; gap: 10px; padding: 0 20px 18px; }
  .progress { height: 6px; border-radius: 99px; background: var(--soft); overflow: hidden; margin: 4px 0 14px; }
  .progress i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .9s ease; }
  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%) translateY(16px);
    background: #23292f; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13.5px;
    opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 60;
  }
  .toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

  .note { display: flex; gap: 10px; align-items: flex-start; background: #fdf7ea; border: 1px solid #ecd9a8; border-radius: 8px; padding: 11px 14px; font-size: 13px; color: #6b5a20; margin-bottom: 16px; }
  .note.blue { background: #eef3f7; border-color: #c8d6e2; color: #2f4a60; }

  /* ── 响应式 ───────────────────────────── */
  @media (max-width: 880px) {
    .topbar { padding: 0 12px; gap: 8px; }
    .topbar .brand small { display: none; }
    .topbar .brand b { font-size: 15px; white-space: nowrap; }
    .link-preview { padding: 6px 9px; font-size: 12.5px; }
    .btn-publish { padding: 7px 11px; font-size: 13.5px; }
    .menu-toggle { display: inline-block; }
    .layout { grid-template-columns: 1fr; }
    .sidenav { position: fixed; z-index: 40; top: 58px; bottom: 0; left: 0; width: 232px; box-shadow: 12px 0 30px rgba(15,26,37,.18); transform: translateX(-105%); transition: transform .18s ease; }
    .sidenav.open { transform: translateX(0); }
    main.view { padding: 18px 14px 60px; }
    .fld-row { grid-template-columns: 1fr; }
    .row { flex-wrap: wrap; }
    .mentor-box { grid-template-columns: 88px 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; }
  }
</style>

<script>
"use strict";

/* ════════ 工作台状态：草稿优先，其次已发布，最后种子数据 ════════ */
const state = window.SiteStore.open();
state.pending = state.pending || [];
state.lastPublish = state.lastPublish || "";

let nextId = 100;
const $ = (sel, root) => (root || document).querySelector(sel);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const roleName = (r) => ({ mentor: "导师", master: "硕士研究生", other: "其他身份" }[r] || r);

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("on");
  clearTimeout(toast._h);
  toast._h = setTimeout(() => t.classList.remove("on"), 2600);
}
function recordPending(label) {
  state.pending.unshift({ label, time: new Date().toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" }) });
  renderPendingCount();
  SiteStore.saveDraft(state);
}
function renderPendingCount() {
  const el = $("#pendingCount");
  el.textContent = String(state.pending.length);
  el.classList.toggle("on", state.pending.length > 0);
}

/* ════════ 通用片段 ════════ */

function onPvSet(pvId, fileName, url) {
  setPv(pvId, url);
  photoDraft.set(pvId, url);
  const rc = document.querySelector('.up-recrop[data-pv="' + pvId + '"]');

}
function bindUploads(root) {
  root.querySelectorAll(".up-input").forEach((inp) => {
    inp.addEventListener("change", () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      AdminImg.process(f, inp.dataset.ratio || "free", (url) => onPvSet(inp.dataset.pv, f.name, url)).then((c) => { if (c) rawCanvases.set(inp.dataset.pv, c); });
    });
  });
  root.querySelectorAll(".up-clear").forEach((btn) => {
    btn.addEventListener("click", () => {
      setPv(btn.dataset.pv, "");
      photoDraft.set(btn.dataset.pv, "");
      const rcBtn = root.querySelector('.up-recrop[data-pv="' + btn.dataset.pv + '"]');
      if (rcBtn) rcBtn.hidden = true;
      const inp = root.querySelector(`.up-input[data-pv="${btn.dataset.pv}"]`);
      if (inp) inp.value = "";
    });
  });
  root.querySelectorAll(".up-recrop").forEach((btn) => {
    btn.addEventListener("click", () => {
      const pv = btn.dataset.pv;
      const inp = root.querySelector(`.up-input[data-pv="${pv}"]`);
      const ratio = (inp && inp.dataset.ratio) || "free";
      if (!RATIOS[ratio]) { toast("此图片位无需裁剪"); return; }
      const done = (url) => onPvSet(pv, "", url);
      const raw = rawCanvases.get(pv);
      if (raw) { AdminImg.recrop(raw, ratio, done); return; }
      const pvEl = document.getElementById(pv);
      const m = pvEl && (pvEl.style.backgroundImage || "").match(/url\("([\s\S]+)"\)/);
      if (!m) { toast("请先上传图片"); return; }
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, 1920 / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.naturalWidth * k));
        c.height = Math.max(1, Math.round(img.naturalHeight * k));
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        AdminImg.recrop(c, ratio, done);
      };
      img.src = m[1];
    });
  });
}

    items[items.length - 1].focus();
  });
}

function readMemberForm(prevPhoto) {
  return {
    name: $("#f-name").value.trim(),
    nameEn: $("#f-nameEn").value.trim(),
    role: $("#f-role").value,
    title: $("#f-title").value.trim(),
    joinYear: $("#f-joinYear").value.trim(),
    areas: [...document.querySelectorAll('input[name="f-areas"]:checked')].map((i) => Number(i.value)),
    email: $("#f-email").value.trim(),
    bio: $("#f-bio").value.trim(),
    photo: photoDraft.has("pv-member-photo") ? (photoDraft.get("pv-member-photo") || null) : (prevPhoto || null),
    published: $("#f-published").checked
  };
}

/* ════════ 科研成果（三个子页签） ════════ */
function renderResearch(el, tab) {
  tab = tab || "pubs";
  const tabs = [["pubs", "论文"], ["patents", "专利"], ["projects", "项目"]];
  let body = "";
  if (tab === "pubs") {
    const years = [...new Set(state.pubs.map((p) => p.year))].sort((a, b) => b - a);
    body = years.map((y) => `<div class="year-head">${y} 年</div><div class="rows">
      ${state.pubs.filter((p) => p.year === y).map((p) => `<div class="row">
        <div class="grow"><h3>${esc(p.title)} ${p.featured ? '<span class="tag gold">最新成果</span>' : ""} ${p.published ? "" : '<span class="tag dim">已下架</span>'}</h3>
        <p class="meta">${esc(p.authors)} · ${esc(p.venueShort || p.venue)} · ${esc(p.type)}</p></div>
        <div class="acts"><a class="btn ghost sm" href="#/pub/${p.id}">编辑</a></div></div>`).join("")}
    </div>`).join("") + `<div style="margin-top:12px"><a class="btn accent sm" href="#/pub/new">＋ 新增论文</a></div>`;
  } else if (tab === "patents") {
    body = state.patents.length ? `<div class="rows">
      ${state.patents.map((p) => `<div class="row">
        <div class="grow"><h3>${esc(p.name)} ${p.published ? "" : '<span class="tag dim">已下架</span>'}</h3>
        <p class="meta"><span class="tag">${esc(p.kind)}</span><span class="tag ${p.status === "已授权" ? "" : "dim"}">${esc(p.status)}</span>${esc(p.inventors)} · ${p.year}</p></div>
        <div class="acts"><a class="btn ghost sm" href="#/patent/${p.id}">编辑</a></div></div>`).join("")}
    </div>` : `<div class="empty"><b>还没有录入专利</b>点击下方按钮录入第一条专利。</div>`;
    body += `<div style="margin-top:12px"><a class="btn accent sm" href="#/patent/new">＋ 新增专利</a></div>`;
  } else if (tab === "projects") {
    body = `<div class="rows">
      ${state.projects.map((p) => `<div class="row">
        <div class="grow"><h3>${esc(p.name)} ${p.published ? "" : '<span class="tag dim">已下架</span>'}</h3>
        <p class="meta"><span class="tag">${esc(p.category)}</span>${esc(p.sponsor)} · ${p.startYear}–${p.endYear} · ${esc(p.status)}</p></div>
        <div class="acts"><a class="btn ghost sm" href="#/project/${p.id}">编辑</a></div></div>`).join("")}
    </div><div style="margin-top:12px"><a class="btn accent sm" href="#/project/new">＋ 新增项目</a></div>`;
  }
  el.innerHTML = `
    ${viewHead("科研成果", "论文、专利、项目是三个独立列表，保存后按对应栏目展示。")}
    <div class="checks" style="margin-bottom:16px" role="tablist">
      ${tabs.map(([k, label]) => `<label><input type="radio" name="rtab" value="${k}" ${k === tab ? "checked" : ""}>${label}</label>`).join("")}
    </div>
    ${body}`;
  el.querySelectorAll('input[name="rtab"]').forEach((i) => i.addEventListener("change", () => { location.hash = "#/research/" + i.value; }));
}

/* ════════ 发布流程 ════════ */
/* ════════ 云端发布：整站数据写入仓库 site-data-published.json（gh-pages + main 双分支） ════════ */
const CLOUD_REPO = "zl2626/lab-website";
const CLOUD_FILE = "site-data-published.json";
async function cloudPut(branch, token, contentB64, message) {
  const headers = { "Authorization": "token " + token, "Accept": "application/vnd.github+json" };
  let sha = null;
  const get = await fetch("https://api.github.com/repos/" + CLOUD_REPO + "/contents/" + CLOUD_FILE + "?ref=" + branch, { headers });
  if (get.status === 200) sha = (await get.json()).sha;
  else if (get.status !== 404) throw new Error("读取云端文件失败（" + get.status + "）");
  const put = await fetch("https://api.github.com/repos/" + CLOUD_REPO + "/contents/" + CLOUD_FILE, {
    method: "PUT", headers,
    body: JSON.stringify({ message: message + "（" + branch + "）", content: contentB64, sha: sha, branch })
  });
  if (!put.ok) throw new Error("写入" + branch + "分支失败（" + put.status + "）");
}
async function cloudPublish(state) {
  const token = (localStorage.getItem("labAdminToken.v1") || "").trim();
  if (!token) { toast("未配置云端发布令牌：本次仅本机预览生效"); return; }
  toast("正在同步到线上（GitHub Pages + Vercel）…");
  try {
    const contentB64 = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
    await cloudPut("gh-pages", token, contentB64, "后台发布更新");
    await cloudPut("main", token, contentB64, "后台发布更新");
    toast("✅ 云端发布完成：全网访客几秒内可见最新内容");
  } catch (err) {
    toast("云端发布失败：" + err.message + "（本机预览已生效）");
  }
}
function openPublish() {
  const dlg = $("#publishDialog");
  const body = $("#publishBody"), foot = $("#publishFoot");
  if (!state.pending.length) {
    body.innerHTML = `<p style="margin:0">没有需要发布的修改。所有已保存的内容都已在线上。</p>`;
    foot.innerHTML = `<button class="btn ghost" id="dlgClose" type="button">好的</button>`;
  } else {
    body.innerHTML = `
      <p style="margin:0 0 10px">将把以下 ${state.pending.length} 处已保存的修改发布到正式网站：</p>
      <ul>${state.pending.map((p) => `<li>${esc(p.label)} · ${esc(p.time)}</li>`).join("")}</ul>
      <div class="progress" style="display:none" id="pubProg"><i></i></div>`;
    foot.innerHTML = `<button class="btn ghost" id="dlgClose" type="button">取消</button><button class="btn accent" id="dlgGo" type="button">确认发布</button>`;
  }
  dlg.showModal();
  $("#dlgClose").addEventListener("click", () => dlg.close());
  const go = $("#dlgGo");
  if (go) go.addEventListener("click", () => {
    $("#pubProg").style.display = "block";
    requestAnimationFrame(() => { $("#pubProg i").style.width = "100%"; });
    go.disabled = true;
    setTimeout(() => {
      state.lastPublish = new Date().toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
      state.pending = [];
      SiteStore.publish(state);
      renderPendingCount();
      dlg.close();
      toast("已发布：打开或刷新前台页面即可看到修改");
      route();
      cloudPublish(state);
    }, 1100);
  });
}

/* ════════ 路由 ════════ */
function route() {
  const hash = location.hash.replace(/^#\/?/, "") || "dashboard";
  const [r, a] = hash.split("/");
  const view = $("#view");
  document.querySelectorAll(".sidenav a").forEach((link) => {
    const key = link.dataset.nav;
    const active = key === r || (key === "team" && r === "member") || (key === "research" && ["pub", "patent", "project"].includes(r)) || (key === "news" && r === "newsitem");
    link.classList.toggle("active", active);
    if (active) link.setAttribute("aria-current", "page"); else link.removeAttribute("aria-current");
  });
  $("#sidenav").classList.remove("open");
  $("#menuToggle").setAttribute("aria-expanded", "false");
  window.scrollTo(0, 0);
  photoDraft.clear();
  switch (r) {
    case "home": renderHome(view); break;
    case "team": renderTeam(view); break;
    case "member": renderMemberEdit(view, a); break;
    case "research": renderResearch(view, a); break;
    case "pub": renderPubEdit(view, a); break;
    case "patent": renderPatentEdit(view, a); break;
    case "project": renderProjectEdit(view, a); break;
    case "news": renderNews(view); break;
    case "newsitem": renderNewsEdit(view, a); break;
    case "contact": renderContact(view); break;
    case "appearance": renderAppearance(view); break;
    case "media": renderMedia(view); break;
    default: renderDashboard(view);
  }
}

/* 全局保存按钮（首页设置 / 联系我们） */
document.addEventListener("click", (e) => {
  const btn = e.target.closest("[data-save]");
  if (!btn) return;
  const kind = btn.dataset.save;
  if (kind === "home") {
    state.home.welcome = $("#f-welcome").value.trim();
    state.home.researchLine = $("#f-research").value.trim();
    state.home.about = $("#f-about").value.trim();
    state.home.aboutDirections = [...document.querySelectorAll("#dirRows > div")].map((row) => {
      const t = row.querySelector(".dir-title");
      const d = row.querySelector(".dir-desc");
      return { t: t ? t.value.trim() : "", d: d ? d.value.trim() : "" };
    }).filter((x) => x.t);
    state.home.mentorId = Number($("#f-mentor").value) || null;
    const mode = document.querySelector('input[name="f-featured"]:checked');
    if (mode) state.home.featuredMode = mode.value;
    if (photoDraft.has("pv-home-photo")) state.home.photo = photoDraft.get("pv-home-photo") || null;
    if (photoDraft.has("pv-hero-bg")) state.home.heroBg = photoDraft.get("pv-hero-bg") || null;
    state.home.platform = [1, 2, 3].map((i) => photoDraft.has("pv-platform-" + i) ? (photoDraft.get("pv-platform-" + i) || null) : ((state.home.platform || [])[i - 1] || null));
    recordPending("修改首页设置");
  } else if (kind === "contact") {
    state.contact = { email: $("#f-email").value.trim(), phone: $("#f-phone").value.trim(), address: $("#f-address").value.trim(), postcode: $("#f-postcode").value.trim() };
    recordPending("修改联系信息");
  } else if (kind === "appearance") {
    const s = state.settings, a = ensureAppearance();
    s.name = $("#f-site-name").value.trim();
    s.nameEn = $("#f-site-nameEn").value.trim();
    s.university = $("#f-uni-name").value.trim();
    s.universityEn = $("#f-uni-nameEn").value.trim();
    a.colorPrimary = $("#f-color-primary").value;
    a.colorAccent = $("#f-color-accent").value;
    a.fontHeading = $("#f-font-heading").value;
    a.fontBody = $("#f-font-body").value;
    a.footerNote = $("#f-footer-note").value.trim();
    if (photoDraft.has("pv-logo-lab")) a.logoLab = photoDraft.get("pv-logo-lab") || "";
    if (photoDraft.has("pv-logo-uni")) a.logoUni = photoDraft.get("pv-logo-uni") || "";
    recordPending("修改网站外观");
  }
  toast("已保存为草稿，点右上角「发布更新」后生效");
  if (btn.dataset.back && btn.dataset.back.startsWith("#/")) { location.hash = btn.dataset.back; route(); }
});

$("#btnPublish").addEventListener("click", openPublish);
$("#menuToggle").addEventListener("click", () => {
  const open = $("#sidenav").classList.toggle("open");
  $("#menuToggle").setAttribute("aria-expanded", String(open));
});
window.addEventListener("hashchange", route);
renderPendingCount();
route();
</script>
